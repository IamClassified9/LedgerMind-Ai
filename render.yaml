services:
  - type: web
    name: ledgermind-api
    runtime: python
    rootDir: backend
    buildCommand: pip install .
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ledgermind-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://ledgermind-web.onrender.com
      - key: GEMMA_API_KEY
        sync: false
      - key: GEMMA_MODEL
        value: gemma-3-4b-it
      - key: SENTRY_DSN
        sync: false
  - type: web
    name: ledgermind-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://ledgermind-api.onrender.com/api/v1
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
databases:
  - name: ledgermind-db
    databaseName: ledgermind_ai
    user: ledgermind
